<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Entering The Bog...</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #071007;
            color: #c9ff72;
            font-family: "Courier New", Courier, monospace;
        }

        .box {
            width: min(90%, 650px);
            padding: 30px;
            border: 2px solid #344d27;
            background: #0d190d;
        }

        h1 {
            margin-top: 0;
        }

        #details {
            color: #9aac82;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        a {
            color: #c9ff72;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>ENTERING THE BOG...</h1>

    <p id="status">
        Exchanging Spotify authorization...
    </p>

    <pre id="details"></pre>

    <p id="backLink" style="display:none;">
        <a href="index.html">Return to The Music Bog</a>
    </p>
</div>


<script>

    async function finishSpotifyLogin() {

        const status =
            document.getElementById(
                "status"
            );

        const details =
            document.getElementById(
                "details"
            );

        const backLink =
            document.getElementById(
                "backLink"
            );


        const params =
            new URLSearchParams(
                window.location.search
            );


        const code =
            params.get(
                "code"
            );


        const spotifyError =
            params.get(
                "error"
            );


        if (spotifyError) {

            status.innerText =
                "Spotify authorization was not completed.";

            details.innerText =
                "Spotify returned: " +
                spotifyError;

            backLink.style.display =
                "block";

            return;
        }


        if (!code) {

            status.innerText =
                "No authorization code came back from Spotify.";

            details.innerText =
                "Go back to The Music Bog and press CONNECT SPOTIFY again.";

            backLink.style.display =
                "block";

            return;
        }


        const codeVerifier =
            localStorage.getItem(
                "code_verifier"
            );


        const clientId =
            localStorage.getItem(
                "spotify_client_id"
            );


        const redirectUri =
            localStorage.getItem(
                "spotify_redirect_uri"
            );


        if (
            !codeVerifier ||
            !clientId ||
            !redirectUri
        ) {

            status.innerText =
                "The Bog lost part of the Spotify login.";

            details.innerText =
                "Missing PKCE verifier or Spotify settings. " +
                "Return to index.html and connect Spotify again.";

            backLink.style.display =
                "block";

            return;
        }


        try {

            const response =
                await fetch(
                    "https://accounts.spotify.com/api/token",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            new URLSearchParams({
                                client_id:
                                    clientId,

                                grant_type:
                                    "authorization_code",

                                code:
                                    code,

                                redirect_uri:
                                    redirectUri,

                                code_verifier:
                                    codeVerifier
                            })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                status.innerText =
                    "Spotify token exchange failed.";

                details.innerText =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );

                backLink.style.display =
                    "block";

                return;
            }


            if (!data.access_token) {

                status.innerText =
                    "Spotify did not return an access token.";

                details.innerText =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );

                backLink.style.display =
                    "block";

                return;
            }


            localStorage.setItem(
                "spotify_access_token",
                data.access_token
            );


            if (data.refresh_token) {

                localStorage.setItem(
                    "spotify_refresh_token",
                    data.refresh_token
                );
            }


            const expiresAt =
                Date.now() +
                (
                    data.expires_in ||
                    3600
                ) * 1000;


            localStorage.setItem(
                "spotify_token_expires_at",
                expiresAt.toString()
            );


            localStorage.removeItem(
                "code_verifier"
            );


            // Remove ?code=... from browser history so refreshing this
            // page doesn't try to exchange the same one-use code again.

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );


            status.innerText =
                "Spotify connected. Returning to the Bog...";

            details.innerText =
                "";


            setTimeout(
                function() {

                    window.location.replace(
                        "index.html"
                    );

                },
                500
            );


        } catch (error) {

            status.innerText =
                "The callback could not reach Spotify.";

            details.innerText =
                error.message;

            backLink.style.display =
                "block";
        }
    }


    finishSpotifyLogin();

</script>

</body>

</html>
